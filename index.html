<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar nuvole e pioggia — Viareggio</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#0b1118;--glass:rgba(11,17,24,.82);--ink:#eef3f8;--muted:#8a9bad;--line:rgba(255,255,255,.09);--accent:#6ec1ff}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;overflow:hidden}
  #map{position:fixed;inset:0}
  .leaflet-container{background:var(--bg)}
  .leaflet-control-zoom a{background:#141d27;color:var(--ink);border-color:var(--line)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#141d27;color:var(--ink);box-shadow:0 6px 24px rgba(0,0,0,.5)}
  .leaflet-popup-content{margin:10px 14px;font-size:13px;line-height:1.5}
  .lbl{background:transparent;border:0;box-shadow:none;color:#fff;font-weight:600;font-size:12px;text-shadow:0 1px 4px #000,0 0 2px #000}
  .lbl::before{display:none}

  #title{position:fixed;top:12px;left:12px;z-index:1000;padding:8px 12px;background:var(--glass);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:10px;font-size:13px;line-height:1.3}
  #title b{display:block;font-size:15px;font-weight:600}
  #title span{color:var(--muted)}

  #panel{position:fixed;left:0;right:0;bottom:0;z-index:1000;padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:var(--glass);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  @media(min-width:760px){#panel{left:auto;right:16px;bottom:16px;width:420px;border:1px solid var(--line);border-radius:14px}}

  .row{display:flex;align-items:center;gap:10px}
  #time{flex:1;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
  #time small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}
  #time em{font-style:normal;color:var(--accent);font-size:13px;font-weight:600;margin-left:6px;vertical-align:middle}
  button,select{border:1px solid var(--line);background:#141d27;color:var(--ink);font:inherit;cursor:pointer}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #play{width:46px;height:46px;border-radius:50%;font-size:17px;flex:none}
  .pill{height:32px;padding:0 10px;border-radius:16px;font-size:13px}
  select.pill{appearance:none;-webkit-appearance:none;padding-right:22px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 14px,calc(100% - 9px) 14px;background-size:4px 4px;background-repeat:no-repeat}

  #tl{position:relative;height:56px;margin:10px 0 2px}
  #spark{position:absolute;inset:0;width:100%;height:100%}
  #slider{position:absolute;left:0;right:0;bottom:-6px;width:100%;margin:0;background:transparent;-webkit-appearance:none;appearance:none;height:24px}
  #slider::-webkit-slider-runnable-track{height:2px;background:var(--line)}
  #slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-7px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 0 0 3px rgba(110,193,255,.25)}
  #slider::-moz-range-track{height:2px;background:var(--line)}
  #slider::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
  #ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}

  #legend{margin-top:10px;font-size:11px;color:var(--muted)}
  #legend .bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#3caaff 0%,#50dc8c 18%,#ffe650 38%,#ff9628 58%,#eb323c 78%,#c83cdc 100%)}
  #legend .lab{display:flex;justify-content:space-between;margin-top:3px;font-variant-numeric:tabular-nums}
  #legend .cl{display:flex;align-items:center;gap:8px;margin-top:6px}
  #legend .cl i{width:60px;height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(162,168,178,0),rgba(162,168,178,.6) 40%,rgba(242,248,255,.92))}
  #status{font-size:11px;color:var(--muted);margin-top:8px;min-height:1em}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map" aria-label="Mappa nuvole e pioggia"></div>
<div id="title"><b>Radar previsionale</b><span>Europa · nuvole e pioggia · 3 giorni · Open-Meteo</span></div>

<div id="panel">
  <div class="row">
    <button id="play" aria-label="Avvia animazione">▶</button>
    <div id="time">—<small>caricamento…</small></div>
    <button id="speed" class="pill" aria-label="Velocità animazione">1×</button>
  </div>
  <div id="tl">
    <canvas id="spark"></canvas>
    <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="Ora">
  </div>
  <div id="ticks"></div>
  <div id="legend">
    <div class="bar"></div>
    <div class="lab"><span>0,2</span><span>1</span><span>2,5</span><span>5</span><span>10</span><span>25 mm/h</span></div>
    <div class="cl"><i></i>copertura nuvolosa · tocca la mappa per i valori puntuali</div>
  </div>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
function boot(){ if (window.L) return start();
  const s=document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  s.onload=start; s.onerror=()=>{document.getElementById('status').textContent='Leaflet non caricato: controlla la connessione.';};
  document.head.appendChild(s);
}
function start(){
  const $=id=>document.getElementById(id);
  const HOME={lat:43.8667,lon:10.25,name:'Viareggio'};
  // estensione Europa
  const LAT_S=34, LAT_N=71.5, LON_W=-12, LON_E=42;
  const NX=26, NY=22;                       // 572 punti, passo ~2.1° lon / 1.8° lat
  const CHUNK=110;                          // punti per richiesta
  const PAST_H=6, FUTURE_H=72, SUB=6;       // 3 giorni, frame ogni 10 min
  const PXW=540, PXH=440;
  let times=[], cloud=[], rain=[], T=0, frames=0, speed=1, timer=null, lastPopup=null;

  // ---- mappa ----
  const bounds=L.latLngBounds([LAT_S,LON_W],[LAT_N,LON_E]);
  const map=L.map('map',{zoomControl:false,minZoom:3,maxZoom:10,worldCopyJump:false}).fitBounds(bounds);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:12,
    attribution:'&copy; OpenStreetMap &copy; CARTO · dati <a href="https://open-meteo.com">Open-Meteo</a>'}).addTo(map);
  map.createPane('labels'); map.getPane('labels').style.zIndex=650; map.getPane('labels').style.pointerEvents='none';
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:12,pane:'labels'}).addTo(map);

  const canvas=document.createElement('canvas'); canvas.width=PXW; canvas.height=PXH;
  const ctx=canvas.getContext('2d');
  const overlay=L.imageOverlay(canvas.toDataURL(),bounds,{interactive:false}).addTo(map);
  L.circleMarker([HOME.lat,HOME.lon],{radius:4,color:'#fff',fillColor:'#6ec1ff',fillOpacity:1,weight:1.5}).addTo(map)
    .bindTooltip(HOME.name,{permanent:true,direction:'right',className:'lbl',offset:[6,0]});
  map.fitBounds(bounds,{paddingTopLeft:[0,50],paddingBottomRight:[0,innerWidth<760?300:0]});

  // ---- griglia ----
  const lats=[],lons=[];
  for(let i=0;i<NY;i++)for(let j=0;j<NX;j++){
    lats.push((LAT_S+(LAT_N-LAT_S)*i/(NY-1)).toFixed(2));   // i: sud→nord
    lons.push((LON_W+(LON_E-LON_W)*j/(NX-1)).toFixed(2));   // j: ovest→est
  }
  const HOME_K=Math.round((HOME.lat-LAT_S)/(LAT_N-LAT_S)*(NY-1))*NX+Math.round((HOME.lon-LON_W)/(LON_E-LON_W)*(NX-1));

  // ---- dati (a blocchi) ----
  function load(){
    stop(); $('status').textContent='Scarico la previsione…'; $('time').innerHTML='—<small>caricamento…</small>';
    const reqs=[];
    for(let a=0;a<lats.length;a+=CHUNK){
      const url='https://api.open-meteo.com/v1/forecast?latitude='+lats.slice(a,a+CHUNK).join(',')+'&longitude='+lons.slice(a,a+CHUNK).join(',')
        +'&hourly=cloud_cover,precipitation&past_hours='+PAST_H+'&forecast_hours='+FUTURE_H+'&timezone=Europe%2FRome';
      reqs.push(fetch(url).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(x=>Array.isArray(x)?x:[x]));
    }
    Promise.all(reqs).then(parts=>{
      const arr=parts.flat();
      times=arr[0].hourly.time; T=times.length; frames=(T-1)*SUB;
      cloud=Array.from({length:T},()=>new Float32Array(NX*NY));
      rain=Array.from({length:T},()=>new Float32Array(NX*NY));
      arr.forEach((loc,k)=>{for(let t=0;t<T;t++){cloud[t][k]=loc.hourly.cloud_cover[t]??0;rain[t][k]=loc.hourly.precipitation[t]??0;}});
      slider.max=frames; slider.value=nowFrame();
      drawSpark(); drawTicks();
      $('status').textContent=NX*NY+' punti di griglia · passo ~'+Math.round((LON_E-LON_W)/(NX-1)*80)+' km · aggiornato '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
      render(+slider.value);
    }).catch(e=>{$('status').textContent='Dati non disponibili ('+e.message+'). Riprova più tardi.';});
  }
  function nowFrame(){const f=(Date.now()-new Date(times[0]).getTime())/3600000*SUB;return Math.max(0,Math.min(frames,Math.round(f)));}
  function frameDate(f){return new Date(new Date(times[0]).getTime()+f/SUB*3600000);}

  // ---- colori ----
  const STOPS=[[0.1,[60,170,255]],[0.5,[80,220,140]],[1.5,[255,230,80]],[4,[255,150,40]],[10,[235,50,60]],[25,[200,60,220]]];
  function rainColor(mm){
    if(mm<=STOPS[0][0])return STOPS[0][1];
    for(let i=1;i<STOPS.length;i++)if(mm<=STOPS[i][0]){
      const a=STOPS[i-1],b=STOPS[i],f=(Math.log(mm)-Math.log(a[0]))/(Math.log(b[0])-Math.log(a[0]));
      return [0,1,2].map(k=>a[1][k]+(b[1][k]-a[1][k])*f);
    }
    return STOPS[STOPS.length-1][1];
  }

  // ---- rendering ----
  const cur=new Float32Array(NX*NY), rur=new Float32Array(NX*NY);
  function bilinear(arr,gx,gy){
    gx=Math.max(0,Math.min(NX-1,gx)); gy=Math.max(0,Math.min(NY-1,gy));
    const x0=Math.floor(gx),y0=Math.floor(gy),x1=Math.min(x0+1,NX-1),y1=Math.min(y0+1,NY-1),fx=gx-x0,fy=gy-y0;
    const a=arr[y0*NX+x0],b=arr[y0*NX+x1],c=arr[y1*NX+x0],d=arr[y1*NX+x1];
    return (a*(1-fx)+b*fx)*(1-fy)+(c*(1-fx)+d*fx)*fy;
  }
  function interp(f){
    const t0=Math.min(T-1,Math.floor(f/SUB)),t1=Math.min(T-1,t0+1),fr=f/SUB-t0;
    for(let k=0;k<NX*NY;k++){cur[k]=cloud[t0][k]*(1-fr)+cloud[t1][k]*fr; rur[k]=rain[t0][k]*(1-fr)+rain[t1][k]*fr;}
  }
  // l'overlay è stirato in proiezione Mercatore: mappo ogni riga del canvas alla latitudine reale
  const merc=lat=>Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
  const mS=merc(LAT_S), mN=merc(LAT_N);
  const rowGy=new Float32Array(PXH);
  for(let py=0;py<PXH;py++){
    const m=mN-(mN-mS)*py/(PXH-1), lat=(2*Math.atan(Math.exp(m))-Math.PI/2)*180/Math.PI;
    rowGy[py]=(lat-LAT_S)/(LAT_N-LAT_S)*(NY-1);
  }
  function render(f){
    if(!T)return; interp(f);
    const img=ctx.createImageData(PXW,PXH),d=img.data;
    for(let py=0;py<PXH;py++){
      const gy=rowGy[py];
      for(let px=0;px<PXW;px++){
        const gx=px/(PXW-1)*(NX-1), o=(py*PXW+px)*4;
        const cc=bilinear(cur,gx,gy)/100, mm=bilinear(rur,gx,gy);
        let ct=(cc-0.25)/0.75; ct=ct<0?0:ct; ct=ct*ct*(3-2*ct);
        const lum=170+80*ct;
        let r=lum-8,g=lum-2,b=lum+8,a=ct*.9;
        if(mm>0.08){
          const [rr,rg,rb]=rainColor(mm), ra=Math.min(.95,.55+Math.log1p(mm)/3);
          r=r*(1-ra)+rr*ra;g=g*(1-ra)+rg*ra;b=b*(1-ra)+rb*ra;a=Math.max(a,ra);
        }
        d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=a*255;
      }
    }
    ctx.putImageData(img,0,0);
    overlay.setUrl(canvas.toDataURL());
    const dt=frameDate(f), nf=nowFrame(), isNow=Math.abs(f-nf)<SUB/2;
    const hm=dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
    const day=dt.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
    $('time').innerHTML=hm+(isNow?'<em>adesso</em>':'')+'<small>'+day+(f<nf?' · passato':' · previsione')+'</small>';
    drawSpark(f);
    if(lastPopup)updatePopup();
  }

  // ---- timeline (valori su Viareggio) ----
  const spark=$('spark'),sctx=spark.getContext('2d');
  function drawSpark(f){
    const w=spark.clientWidth,h=spark.clientHeight,dpr=devicePixelRatio||1;
    if(spark.width!==w*dpr){spark.width=w*dpr;spark.height=h*dpr;}
    sctx.setTransform(dpr,0,0,dpr,0,0); sctx.clearRect(0,0,w,h);
    if(!T)return;
    const bw=w/(T-1); let max=0.5;
    for(let t=0;t<T;t++)max=Math.max(max,rain[t][HOME_K]);
    sctx.fillStyle='rgba(220,228,238,.12)';
    for(let t=0;t<T-1;t++){const hh=cloud[t][HOME_K]/100*(h-10);sctx.fillRect(t*bw,h-4-hh,bw,hh);}
    for(let t=0;t<T-1;t++){const v=rain[t][HOME_K];if(v<0.05)continue;const [r,g,b]=rainColor(v);sctx.fillStyle=`rgb(${r|0},${g|0},${b|0})`;
      const hh=Math.max(2,Math.log1p(v)/Math.log1p(max)*(h-10));sctx.fillRect(t*bw+.5,h-4-hh,Math.max(1,bw-1),hh);}
    const nx=nowFrame()/frames*w; sctx.strokeStyle='rgba(110,193,255,.9)';sctx.setLineDash([3,3]);sctx.beginPath();sctx.moveTo(nx,0);sctx.lineTo(nx,h);sctx.stroke();sctx.setLineDash([]);
    if(f!=null){const x=f/frames*w;sctx.fillStyle='rgba(255,255,255,.85)';sctx.fillRect(x-.5,0,1,h);}
  }
  function drawTicks(){
    const el=$('ticks'); el.innerHTML='';
    for(let t=0;t<T;t+=12){const dt=new Date(times[t]);const s=document.createElement('span');
      s.textContent=dt.getHours()===0?dt.toLocaleDateString('it-IT',{weekday:'short',day:'numeric'}):dt.getHours()+'h';el.appendChild(s);}
  }

  // ---- interazione ----
  const slider=$('slider');
  slider.addEventListener('input',()=>{stop();render(+slider.value);});
  $('play').addEventListener('click',()=>timer?stop():play());
  $('speed').addEventListener('click',()=>{speed=speed===1?2:speed===2?4:1;$('speed').textContent=speed+'×';if(timer){stop();play();}});
  function play(){$('play').textContent='❚❚';$('play').setAttribute('aria-label','Ferma animazione');
    timer=setInterval(()=>{let v=+slider.value+1;if(v>frames)v=0;slider.value=v;render(v);},130/speed);}
  function stop(){clearInterval(timer);timer=null;$('play').textContent='▶';$('play').setAttribute('aria-label','Avvia animazione');}

  map.on('click',e=>{
    if(!T)return; const ll=e.latlng;
    if(!bounds.contains(ll)){if(lastPopup){map.closePopup(lastPopup);lastPopup=null;}return;}
    lastPopup=L.popup({closeButton:false,autoPan:false}).setLatLng(ll).openOn(map); updatePopup();
  });
  map.on('popupclose',()=>lastPopup=null);
  function updatePopup(){
    const ll=lastPopup.getLatLng();
    const gx=(ll.lng-LON_W)/(LON_E-LON_W)*(NX-1), gy=(ll.lat-LAT_S)/(LAT_N-LAT_S)*(NY-1);
    const cc=bilinear(cur,gx,gy), mm=bilinear(rur,gx,gy);
    lastPopup.setContent('<b>'+frameDate(+slider.value).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'</b><br>'
      +'Nuvole '+Math.round(cc)+'%<br>Pioggia '+(mm<0.05?'assente':mm.toFixed(1).replace('.',',')+' mm/h'));
  }
  addEventListener('resize',()=>drawSpark(+slider.value));

  load();
}
boot();
</script>
</body>
</html>
